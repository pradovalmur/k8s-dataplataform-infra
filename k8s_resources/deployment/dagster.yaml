apiVersion: v1
kind: Namespace
metadata:
  name: dagster
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dagster
  namespace: dagster
---
apiVersion: v1
kind: Secret
metadata:
  name: dagster-postgres
  namespace: dagster
type: Opaque
stringData:
  POSTGRES_USER: "dagster"
  POSTGRES_PASSWORD: "dagster123"
  POSTGRES_DB: "dagster"
---
apiVersion: v1
kind: Secret
metadata:
  name: dagster-s3
  namespace: dagster
type: Opaque
stringData:
  S3_ACCESS_KEY: "minioadmin"
  S3_SECRET_KEY: "minioadmin123"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dagster-instance
  namespace: dagster
data:
  dagster.yaml: |
    storage:
      postgres:
        postgres_db:
          username: dagster
          password: dagster123
          hostname: dagster-postgres
          db_name: dagster
          port: 5432

    local_artifact_storage:
      module: dagster._core.storage.root
      class: LocalArtifactStorage
      config:
        base_dir: /opt/dagster/dagster_home

    compute_logs:
      module: dagster._core.storage.local_compute_log_manager
      class: LocalComputeLogManager
      config:
        base_dir: /opt/dagster/dagster_home/storage/compute_logs

    telemetry:
      enabled: false

  workspace.yaml: |
    load_from:
      - grpc_server:
          host: dagster-user-code
          port: 3030
          location_name: astronomy
---
apiVersion: v1
kind: Service
metadata:
  name: dagster-postgres-headless
  namespace: dagster
spec:
  clusterIP: None
  selector:
    app: dagster-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: dagster-postgres
  namespace: dagster
spec:
  type: ClusterIP
  selector:
    app: dagster-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dagster-postgres
  namespace: dagster
spec:
  serviceName: dagster-postgres-headless
  replicas: 1
  selector:
    matchLabels:
      app: dagster-postgres
  template:
    metadata:
      labels:
        app: dagster-postgres
    spec:
      serviceAccountName: dagster
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:16
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: dagster-postgres
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: hcloud-volumes
        resources:
          requests:
            storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dagster-user-code
  namespace: dagster
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dagster-user-code
  template:
    metadata:
      labels:
        app: dagster-user-code
    spec:
      serviceAccountName: dagster
      containers:
        - name: user-code
          image: pradovalmur/dagster-astronomy:latest
          imagePullPolicy: Always
          env:
            - name: PYTHONPATH
              value: /opt/dagster/app
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: dagster-s3
                  key: S3_ACCESS_KEY
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: dagster-s3
                  key: S3_SECRET_KEY
            - name: S3_ENDPOINT
              value: http://minio.minio.svc.cluster.local:9000
            - name: S3_BUCKET
              value: analytics
            - name: SPACE_TRACK_IDENTITY
              valueFrom:
                secretKeyRef:
                  name: dagster-space-track
                  key: SPACE_TRACK_IDENTITY
            - name: SPACE_TRACK_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dagster-space-track
                  key: SPACE_TRACK_PASSWORD
          command:
            - dagster
          args:
            - api
            - grpc
            - -h
            - 0.0.0.0
            - -p
            - "3030"
            - -f
            - /opt/dagster/app/repo.py
          ports:
            - name: grpc
              containerPort: 3030
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dagster-webserver
  namespace: dagster
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dagster-webserver
  template:
    metadata:
      labels:
        app: dagster-webserver
    spec:
      serviceAccountName: dagster
      containers:
        - name: webserver
          image: dagster/dagster-k8s:1.12.18
          imagePullPolicy: IfNotPresent
          command:
            - dagster-webserver
          args:
            - -h
            - 0.0.0.0
            - -p
            - "3000"
            - -w
            - /opt/dagster/workspace.yaml
          env:
            - name: DAGSTER_HOME
              value: /opt/dagster
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /server_info
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /server_info
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: dagster-config
              mountPath: /opt/dagster
      volumes:
        - name: dagster-config
          configMap:
            name: dagster-instance
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dagster-daemon
  namespace: dagster
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dagster-daemon
  template:
    metadata:
      labels:
        app: dagster-daemon
    spec:
      serviceAccountName: dagster
      containers:
        - name: daemon
          image: dagster/dagster-k8s:1.12.18
          imagePullPolicy: IfNotPresent
          command:
            - dagster-daemon
          args:
            - run
            - -w
            - /opt/dagster/workspace.yaml
          env:
            - name: DAGSTER_HOME
              value: /opt/dagster
          volumeMounts:
            - name: dagster-config
              mountPath: /opt/dagster
      volumes:
        - name: dagster-config
          configMap:
            name: dagster-instance
---
apiVersion: v1
kind: Service
metadata:
  name: dagster-webserver
  namespace: dagster
spec:
  type: ClusterIP
  selector:
    app: dagster-webserver
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: dagster-user-code
  namespace: dagster
spec:
  type: ClusterIP
  selector:
    app: dagster-user-code
  ports:
    - name: grpc
      port: 3030
      targetPort: 3030
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dagster
  namespace: dagster
  annotations:
    kubernetes.io/ingress.class: traefik
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - dagster.chameleonmountain.com
      secretName: wildcard-tls
  rules:
    - host: dagster.chameleonmountain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dagster-webserver
                port:
                  number: 3000