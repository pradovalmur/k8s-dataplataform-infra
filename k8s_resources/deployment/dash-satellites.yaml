apiVersion: v1
kind: Namespace
metadata:
  name: dashboards
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dash-satellites
  namespace: dashboards
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dash-satellites
  template:
    metadata:
      labels:
        app: dash-satellites
    spec:
      containers:
        - name: dash-satellites
          image: pradovalmur/dash-satellites:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8050
          env:
            - name: TRINO_HOST
              value: trino.analytics.svc.cluster.local
            - name: TRINO_PORT
              value: "8080"
            - name: TRINO_USER
              value: dash
            - name: TRINO_CATALOG
              value: iceberg
            - name: TRINO_SCHEMA
              value: space
          readinessProbe:
            httpGet:
              path: /
              port: 8050
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8050
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: dash-satellites
  namespace: dashboards
spec:
  type: ClusterIP
  selector:
    app: dash-satellites
  ports:
    - name: http
      port: 8050
      targetPort: 8050
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dash-satellites
  namespace: dashboards
  annotations:
    kubernetes.io/ingress.class: traefik
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - satellites.chameleonmountain.com
      secretName: wildcard-tls
  rules:
    - host: satellites.chameleonmountain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dash-satellites
                port:
                  number: 8050